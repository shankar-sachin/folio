[package]
name = "folio"
version = "2.0.0"
description = "Folio — a live-edit Markdown reader"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.7"
serde_json = "1"
regex = "1"
notify = "8.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
codegen-units = 4
