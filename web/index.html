<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: mdasset: https: http:; font-src 'self'; connect-src ipc: http://ipc.localhost;">
<title>Folio</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-keys="Escape,Ctrl+Tab,Ctrl+Shift+Tab" data-k="global">
<div id="app">
  <header id="titlebar" data-tauri-drag-region>
    <div class="tb-left" data-tauri-drag-region>
      <button class="tb-btn" id="tb-sidebar" title="Toggle Sidebar (⌘\)" data-a="cmd:toggleSidebar"></button>
    </div>
    <button id="command-center" title="Go to File (⌘P)" data-a="cmd:quickOpen"><span class="cc-icon" id="cc-icon"></span><span id="cc-label">Folio</span><kbd>⌘P</kbd></button>
    <div class="tb-right" data-tauri-drag-region>
      <button class="tb-btn" id="tb-mode" data-a="cmd:togglePreview"></button>
      <button class="tb-btn" id="tb-theme" title="Theme (⌥⌘T)" data-a="cmd:pickTheme"></button>
    </div>
  </header>
  <div id="workbench">
    <nav id="activitybar" aria-label="Views">
      <div class="ab-top" id="ab-top"></div>
      <div class="ab-bottom" id="ab-bottom"></div>
    </nav>
    <aside id="sidebar" data-on="explorer">
      <section class="view" data-view="explorer">
        <div class="view-head"><span>Explorer</span><div class="view-actions" id="explorer-actions"></div></div>
        <div class="view-body" id="explorer-body" tabindex="0" data-ctx="explorer" data-keys="ArrowUp,ArrowDown,ArrowLeft,ArrowRight,Enter,Space,Meta+Backspace" data-k="tree"></div>
      </section>
      <section class="view" data-view="search">
        <div class="view-head"><span>Search</span><div class="view-actions" id="search-actions"></div></div>
        <div class="search-box">
          <div class="field"><input id="search-input" placeholder="Search workspace" spellcheck="false" autocomplete="off" data-i="search" data-keys="Enter,Escape" data-k="search"><div class="toggles" id="search-toggles"></div></div>
          <div id="search-summary"></div>
        </div>
        <div class="view-body" id="search-results"></div>
      </section>
      <section class="view" data-view="outline">
        <div class="view-head"><span>Outline</span><div class="view-actions" id="outline-actions"></div></div>
        <div class="search-box"><div class="field"><input id="outline-filter" placeholder="Filter headings" spellcheck="false" autocomplete="off" data-i="ofilter"></div></div>
        <div class="view-body" id="outline-body"></div>
      </section>
      <section class="view" data-view="workspaces">
        <div class="view-head"><span>Workspaces</span><div class="view-actions" id="workspaces-actions"></div></div>
        <div class="view-body" id="workspaces-body"></div>
      </section>
    </aside>
    <div id="sash" role="separator" aria-label="Resize sidebar" data-resize="sidebar" data-ref="#sidebar" data-var="--sidebar-w" data-min="180" data-max="560"></div>
    <main id="editor">
      <div id="tabbar" class="empty"><div id="tabs" role="tablist" data-hwheel data-tauri-drag-region></div><div id="editor-actions"></div></div>
      <div id="breadcrumbs" hidden></div>
      <div id="docs"></div>
      <div id="findwidget" hidden>
        <div class="field"><input id="find-input" placeholder="Find" spellcheck="false" autocomplete="off" data-i="find" data-keys="Enter,Shift+Enter,Escape" data-k="find"><div class="toggles" id="find-toggles"></div></div>
        <span id="find-count">No results</span>
        <button id="find-prev" class="icon-btn" title="Previous Match (⇧↵)" data-a="cmd:findPrev"></button>
        <button id="find-next" class="icon-btn" title="Next Match (↵)" data-a="cmd:findNext"></button>
        <button id="find-close" class="icon-btn" title="Close (Esc)" data-a="cmd:closeFind"></button>
      </div>
      <div id="welcome" hidden></div>
    </main>
  </div>
  <footer id="statusbar"><div class="sb-left" id="sb-left"></div><div class="sb-right" id="sb-right"></div></footer>
</div>
<div id="palette" hidden data-self="palclose"><div class="pal-box"><input id="pal-input" spellcheck="false" autocomplete="off" data-i="pal" data-keys="Escape,Enter,ArrowUp,ArrowDown,Ctrl+n,Ctrl+p" data-k="pal"><div id="pal-list" role="listbox"></div></div></div>
<div id="menu" hidden></div>
<div id="toasts"></div>
<template id="copied-tpl"></template>
<script src="folio.js"></script>
</body>
</html>
